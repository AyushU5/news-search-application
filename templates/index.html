<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI News Hub</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<header>

<h1>📰 AI News Hub</h1>

<p>Search the latest news from around the world</p>

<form method="GET">

<input
type="text"
name="q"
placeholder="Search AI, Tesla, Cricket, Python..."
value="{{ query }}"
>

<button type="submit">Search</button>

</form>

</header>

<div class="grid">

{% for article in articles %}

<div class="card">

{% if article.urlToImage %}
<img src="{{ article.urlToImage }}">
{% endif %}

<div class="content">

<span class="source">
{{ article.source.name }}
</span>

<h2>{{ article.title }}</h2>

<p>
{{ article.description or "No description available." }}
</p>

<a href="{{ article.url }}" target="_blank">
Read More →
</a>

</div>

</div>

{% endfor %}

</div>

</body>

</html>
